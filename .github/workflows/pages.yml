# Publishes the site to GitHub Pages on every push to master.
#
# `enablement: true` switches Pages on via the API if it has never been enabled,
# so this works without visiting Settings -> Pages at all. After the first
# successful run the site is live and every later push redeploys it.
#
# Nothing is built: the suite is plain static HTML/CSS/JS, so the repository is
# uploaded as-is.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:      # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling a live publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages (enabling it if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

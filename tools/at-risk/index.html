<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>At-Risk Radar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="../../assets/js/data-grid.js"></script>
<script src="../../assets/js/student-master.js"></script>

<style>
.ar-layout{display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start}
@media(max-width:980px){.ar-layout{grid-template-columns:1fr}}
.ar-attach{background:#FCFBF7;border:1px dashed var(--line2);border-radius:9px;padding:11px 13px;margin-bottom:12px}
.ar-attach b{font-size:12.5px;color:var(--navy);display:block;margin-bottom:3px}
.ar-attach p{margin:0 0 8px;font-size:11.5px;color:var(--mut);line-height:1.45}
.ar-attach .ok{color:var(--b5);font-weight:600}
.ar-row{display:flex;gap:12px;align-items:flex-start;padding:13px 4px;border-bottom:1px solid var(--line)}
.ar-row:last-child{border-bottom:none}
.ar-badge{width:44px;flex-shrink:0;text-align:center;border-radius:9px;padding:6px 3px;font-weight:800;
  font-size:15px;font-family:Georgia,serif;line-height:1.1}
.ar-badge small{display:block;font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  font-family:inherit;opacity:.85;margin-top:2px}
.ar-hi{background:var(--b1s);color:var(--b1)}
.ar-wa{background:var(--amber-soft);color:var(--amber)}
.ar-ok{background:var(--b5s);color:var(--b5)}
.ar-main{flex:1;min-width:0}
.ar-name{font-weight:700;color:var(--navy);font-size:14.5px}
.ar-sub{font-size:11.5px;color:var(--mut);margin-top:1px}
.ar-flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.ar-flag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
.ar-action{margin-top:7px;font-size:12px;color:#22595a;background:var(--teal-soft);
  border-left:3px solid var(--teal);border-radius:6px;padding:7px 10px;line-height:1.5}
.ar-money{text-align:right;flex-shrink:0;min-width:96px}
.ar-money .v{font-weight:700;font-size:14px;color:var(--b1)}
.ar-money .l{font-size:10px;color:var(--mut);margin-top:2px}
.ar-weights label{display:block;font-size:11.5px;color:var(--mut);margin:9px 0 4px;font-weight:600}
.ar-weights input[type=range]{width:100%;accent-color:var(--teal)}
.ar-weights .val{float:right;color:var(--navy);font-weight:700}
.call-tbl td{vertical-align:top}
.call-note{border:1px solid var(--line2);border-radius:5px;height:34px}
</style>
</head>
<body>
<script>
/* =================================================================
   Sample: a batch where each student leaks in a different way, so the
   demo shows every signal firing — and shows that a student can be fine
   academically but still about to walk out over unpaid fees.
   ================================================================= */
const SAMPLE_SHEETS={
"Students":[
 ["Roll No","Student Name","Class / Batch","Parent / Guardian Name","Parent Phone"],
 [1,"Aarav Shah","11th Science","Mr. R. Shah","98765 43210"],
 [2,"Diya Kulkarni","11th Science","Mrs. S. Kulkarni","98220 11223"],
 [3,"Kabir Nair","11th Science","Mr. V. Nair","99700 55443"],
 [4,"Ishita Mehra","11th Science","Mrs. P. Mehra","97650 88110"],
 [5,"Rohan Bhosale","11th Science","Mr. D. Bhosale","90280 33221"],
 [6,"Sanya Bhatt","11th Science","Mr. A. Bhatt","98900 77112"]],
"Marks":[
 [null,"MAX MARKS →",50,50,50,50,50],
 ["Roll No","Student Name","Test 1","Test 2","Test 3","Test 4","Test 5"],
 [1,"Aarav Shah",42,44,43,45,46],
 [2,"Diya Kulkarni",38,34,29,24,19],
 [3,"Kabir Nair",30,31,29,32,30],
 [4,"Ishita Mehra",45,46,44,47,48],
 [5,"Rohan Bhosale",22,"A",18,"A",14],
 [6,"Sanya Bhatt",36,37,35,38,36]],
"Attendance":[
 ["Roll No","Student Name","W1","W2","W3","W4","W5","W6","W7","W8","W9","W10"],
 [1,"Aarav Shah","P","P","P","P","P","P","P","P","P","P"],
 [2,"Diya Kulkarni","P","P","A","P","A","A","P","A","A","A"],
 [3,"Kabir Nair","P","P","P","P","P","A","P","P","P","P"],
 [4,"Ishita Mehra","P","P","P","P","P","P","P","P","P","P"],
 [5,"Rohan Bhosale","A","A","P","A","A","A","P","A","A","A"],
 [6,"Sanya Bhatt","P","P","P","P","P","P","P","P","P","P"]],
"Charges":[
 ["Student Name","Item","Amount","Due Date"],
 ["Aarav Shah","Term 1 Tuition",18000,"2025-07-15"],
 ["Diya Kulkarni","Term 1 Tuition",18000,"2025-07-15"],
 ["Kabir Nair","Term 1 Tuition",18000,"2025-07-15"],
 ["Ishita Mehra","Term 1 Tuition",18000,"2025-07-15"],
 ["Rohan Bhosale","Term 1 Tuition",18000,"2025-07-15"],
 ["Sanya Bhatt","Term 1 Tuition",18000,"2025-07-15"]],
"Payments":[
 ["Receipt No","Date","Student Name","Amount","Mode","Note"],
 ["R-2001","2025-07-10","Aarav Shah",18000,"UPI","Term 1"],
 ["R-2002","2025-07-14","Diya Kulkarni",18000,"UPI","Term 1"],
 ["R-2003","2025-07-11","Ishita Mehra",18000,"Cheque","Term 1"],
 ["R-2004","2025-07-12","Sanya Bhatt",18000,"UPI","Term 1"]]};

function parse(sheets){
  const O=OFFICE;
  const studAoa=O.findSheet(sheets,"Students");
  const roster=studAoa?O.readTable(studAoa,{
    roll:["Roll No","Roll","Sr. No."],name:["Student Name","Name"],
    batch:["Class / Batch","Program / Division","Class","Batch","Division"],
    parent:["Parent / Guardian Name","Parent Name","Guardian Name"],
    phone:["Parent Phone","Phone","Contact","Mobile"]
  }).map(r=>({roll:O.toNum(r.roll),name:O.norm(r.name),batch:O.norm(r.batch),
    parent:O.norm(r.parent),phone:O.norm(r.phone)})).filter(s=>s.name):[];
  const acad=O.readAcademic(sheets),att=O.readAttendance(sheets),fees=O.readFees(sheets);
  // Names can arrive from any of the four sources; union them so a student who only
  // appears in the fee ledger still gets watched.
  const keys={};
  roster.forEach(s=>keys[O.keyName(s.name)]={roll:s.roll,name:s.name,batch:s.batch,parent:s.parent,phone:s.phone});
  const add=(k,nm)=>{if(!keys[k])keys[k]={roll:null,name:nm,batch:"",parent:"",phone:""};};
  if(acad)Object.keys(acad.byName).forEach(k=>add(k,acad.byName[k].name));
  if(fees)Object.keys(fees.byName).forEach(k=>add(k,k));
  if(!Object.keys(keys).length)throw new Error("No students found — this workbook needs a Students, Marks or Charges sheet.");
  return{keys,acad,att,fees,
    have:{acad:!!acad,att:!!att,fees:!!fees}};
}

/* =================================================================
   SCORING — deliberately transparent. Every point a student carries is
   traceable to one named reason shown on screen, because a teacher will
   only act on a list they can argue with.
   ================================================================= */
let W={attendance:3,marks:3,fees:3,missed:2};
let D=null,MOUNT=null,VIEW="radar",SHOW="risk";
const O=()=>OFFICE;

function assess(){
  const o=O(),rows=[];
  Object.keys(D.keys).forEach(k=>{
    const s=D.keys[k];
    const a=D.acad?D.acad.byName[k]:null;
    const at=D.att?D.att.byName[k]:null;
    const f=D.fees?D.fees.byName[k]:null;
    const flags=[];let score=0;
    if(at&&at.pct!=null){
      if(at.pct<60){score+=W.attendance;flags.push({t:"b1",label:`Attendance ${at.pct.toFixed(0)}%`,why:"severe"});}
      else if(at.pct<75){score+=Math.round(W.attendance*0.66);flags.push({t:"b2",label:`Attendance ${at.pct.toFixed(0)}%`,why:"below 75%"});}
    }
    if(a){
      if(a.slope!=null&&a.slope<-3){score+=W.marks;flags.push({t:"b1",label:`Marks falling ${a.slope.toFixed(1)} pts/test`,why:"trend"});}
      else if(a.slope!=null&&a.slope<-1){score+=Math.round(W.marks*0.5);flags.push({t:"b2",label:"Marks drifting down",why:"trend"});}
      if(a.avg!=null&&a.avg<40){score+=Math.round(W.marks*0.66);flags.push({t:"b1",label:`Average ${a.avg.toFixed(0)}%`,why:"low"});}
      if(a.absences>=2){score+=W.missed;flags.push({t:"b2",label:`Missed ${a.absences} tests`,why:"absent"});}
    }
    if(f&&f.overdue>0){
      const sev=f.daysOverdue>30;
      score+=sev?W.fees:Math.round(W.fees*0.66);
      flags.push({t:sev?"b1":"b2",label:`${o.money(f.overdue)} overdue${f.daysOverdue?` · ${f.daysOverdue}d`:""}`,why:"fees"});
    }
    const level=score>=6?"high":score>=3?"watch":"ok";
    rows.push({key:k,...s,acad:a,att:at,fee:f,score,flags,level,
      atRisk:f&&f.balance>0?f.balance:0,action:suggest(flags,a,at,f)});
  });
  rows.sort((x,y)=>y.score-x.score||(y.atRisk-x.atRisk));
  return rows;
}
// The list is only useful if it tells you what to do next, so the top signal
// decides the suggested action rather than a generic "follow up".
function suggest(flags,a,at,f){
  const has=w=>flags.some(x=>x.why===w);
  if(has("severe"))return "Call the parent today — attendance has collapsed, which is how a dropout usually starts.";
  if(has("fees")&&(has("below 75%")||has("trend")))return "Fee reminder plus a check-in call: money trouble and disengagement often arrive together.";
  if(has("trend"))return "Sit with them on the weakest recent test and agree one concrete revision target.";
  if(has("below 75%"))return "Ask the parent what's changed at home before attendance slides further.";
  if(has("low"))return "Arrange a doubt-clearing session; the gap is now wide enough to compound.";
  if(has("absent"))return "Reschedule the missed tests so the record stops looking worse than the student is.";
  if(has("fees"))return "Send the fee reminder with the exact outstanding amount and a due date.";
  return "No action needed right now.";
}

function flagStyle(t){return t==="b1"?"background:var(--b1s);color:var(--b1)":"background:var(--amber-soft);color:var(--amber)";}
function badge(level){
  const map={high:["ar-hi","High"],watch:["ar-wa","Watch"],ok:["ar-ok","OK"]};
  return map[level];
}

function renderRadar(){
  const o=O(),rows=assess();
  const shown=rows.filter(r=>SHOW==="all"?true:SHOW==="high"?r.level==="high":r.level!=="ok");
  const nHigh=rows.filter(r=>r.level==="high").length,nWatch=rows.filter(r=>r.level==="watch").length;
  const revAtRisk=rows.filter(r=>r.level!=="ok").reduce((a,r)=>a+r.atRisk,0);
  const missing=[];
  if(!D.have.acad)missing.push("marks");
  if(!D.have.att)missing.push("attendance");
  if(!D.have.fees)missing.push("fees");

  MOUNT.innerHTML=`
    <div class="of-view" id="v-radar">
      <div class="of-head no-print">
        <div><div class="of-eyebrow">Before they drift away</div><h2>At-Risk Radar</h2></div>
        <div class="of-filters">
          <label class="flab">Show</label>
          <select id="fShow">
            <option value="risk"${SHOW==="risk"?" selected":""}>At risk only</option>
            <option value="high"${SHOW==="high"?" selected":""}>High risk only</option>
            <option value="all"${SHOW==="all"?" selected":""}>Everyone</option>
          </select>
          <button class="btn btn-ghost" id="bPrint">Print / Save as PDF</button>
          <button class="btn btn-primary" id="bShare">Share (WhatsApp / Email)</button>
        </div>
      </div>
      ${o.printHead("At-Risk Radar","")}
      <div class="kpis">
        <div class="kpi"><div class="k">High risk</div><div class="v" style="color:var(--b1)">${nHigh}</div><div class="s">need a call now</div></div>
        <div class="kpi"><div class="k">Watch</div><div class="v" style="color:var(--amber)">${nWatch}</div><div class="s">drifting</div></div>
        <div class="kpi"><div class="k">Steady</div><div class="v" style="color:var(--b5)">${rows.length-nHigh-nWatch}</div><div class="s">of ${rows.length} students</div></div>
        <div class="kpi"><div class="k">Revenue at risk</div><div class="v" style="color:var(--b1)">${o.money(revAtRisk)}</div><div class="s">unpaid, from flagged students</div></div>
      </div>
      ${missing.length?`<div class="panel no-print" style="margin-bottom:16px;border-left:3px solid var(--amber)">
        <h3 style="margin-bottom:4px">Only part of the picture</h3>
        <p class="sub" style="margin:0">No <b>${missing.join("</b>, <b>")}</b> data in this workbook, so those signals can't fire.
        Attach the missing workbook on the left and the scores update.</p></div>`:""}
      <div class="ar-layout">
        <div class="panel no-print ar-weights">
          <h3>Attach more signals</h3>
          <p class="sub">The radar sharpens as you add data.</p>
          ${attachBlock("acad","Marks &amp; attendance",D.have.acad||D.have.att)}
          ${attachBlock("fees","Fee ledger",D.have.fees)}
          <h3 style="margin-top:16px">How much each signal counts</h3>
          <p class="sub" style="margin-bottom:4px">Tune it to how your academy actually loses students.</p>
          <label>Attendance <span class="val" id="vAtt">${W.attendance}</span></label>
          <input type="range" min="0" max="5" value="${W.attendance}" id="wAtt">
          <label>Falling marks <span class="val" id="vMarks">${W.marks}</span></label>
          <input type="range" min="0" max="5" value="${W.marks}" id="wMarks">
          <label>Overdue fees <span class="val" id="vFees">${W.fees}</span></label>
          <input type="range" min="0" max="5" value="${W.fees}" id="wFees">
          <label>Missed tests <span class="val" id="vMissed">${W.missed}</span></label>
          <input type="range" min="0" max="5" value="${W.missed}" id="wMissed">
          <p style="font-size:11px;color:var(--mut);margin:10px 0 0;line-height:1.5">
            High risk is 6 points or more; Watch is 3 to 5.</p>
        </div>
        <div class="panel">
          <h3>${SHOW==="all"?"Every student":"Students who need attention"}</h3>
          <p class="sub">Ranked by risk. Every point comes from a reason shown below the name.</p>
          ${shown.length?shown.map(r=>{
            const[cls,lab]=badge(r.level);
            return `<div class="ar-row">
              <div class="ar-badge ${cls}">${r.score}<small>${lab}</small></div>
              <div class="ar-main">
                <div class="ar-name">${o.esc(r.name)}</div>
                <div class="ar-sub">${r.roll!=null?"Roll "+r.roll+" · ":""}${o.esc(r.batch||"")}${r.phone?" · "+o.esc(r.phone):""}</div>
                ${r.flags.length?`<div class="ar-flags">${r.flags.map(f=>
                  `<span class="ar-flag" style="${flagStyle(f.t)}">${o.esc(f.label)}</span>`).join("")}</div>`:
                  `<div class="ar-sub" style="color:var(--b5)">No warning signs.</div>`}
                ${r.level!=="ok"?`<div class="ar-action">${o.esc(r.action)}</div>`:""}
              </div>
              ${r.atRisk>0?`<div class="ar-money"><div class="v">${o.money(r.atRisk)}</div><div class="l">unpaid</div></div>`:""}
            </div>`;}).join(""):`<div class="empty">Nobody is flagged. 🎉</div>`}
        </div>
      </div>
    </div>`;

  document.getElementById("fShow").addEventListener("change",e=>{SHOW=e.target.value;renderRadar();});
  [["wAtt","attendance"],["wMarks","marks"],["wFees","fees"],["wMissed","missed"]].forEach(([id,k])=>{
    const el=document.getElementById(id);
    if(el)el.addEventListener("input",e=>{W[k]=Number(e.target.value);renderRadar();});
  });
  wireAttach();
  document.getElementById("bPrint").addEventListener("click",()=>o.printView("v-radar"));
  document.getElementById("bShare").addEventListener("click",e=>{
    const el=document.getElementById("v-radar");
    const hide=[...el.querySelectorAll(".no-print")],prev=hide.map(h=>h.style.display);
    hide.forEach(h=>h.style.display="none");
    const ph=el.querySelector(".of-print-head");if(ph)ph.style.display="flex";
    Promise.resolve(o.sharePDF(el,o.slugify(o.branding.name)+"_at_risk.pdf","At-Risk Radar",e.target))
      .finally(()=>{hide.forEach((h,i)=>h.style.display=prev[i]);if(ph)ph.style.display="";});
  });
}

function attachBlock(id,label,loaded){
  return `<div class="ar-attach">
    <b>${label}</b>
    <p>${loaded?'<span class="ok">✓ Loaded</span>':"Not loaded yet."}</p>
    <input type="file" id="f_${id}" accept=".xlsx,.xls" style="display:none">
    <button class="btn btn-ghost" id="p_${id}" style="padding:6px 11px;font-size:12px">${loaded?"Replace":"Choose file"}</button>
  </div>`;
}
function wireAttach(){
  const o=O();
  [["acad",s=>{const a=o.readAcademic(s),at=o.readAttendance(s);
      if(!a&&!at)throw new Error("No Marks or Attendance sheet in that file.");
      if(a){D.acad=a;D.have.acad=true;}
      if(at){D.att=at;D.have.att=true;}}],
   ["fees",s=>{const f=o.readFees(s);
      if(!f)throw new Error("No Charges or Payments sheet in that file.");
      D.fees=f;D.have.fees=true;}]
  ].forEach(([id,apply])=>{
    const pick=document.getElementById("p_"+id),inp=document.getElementById("f_"+id);
    if(!pick||!inp)return;
    pick.addEventListener("click",()=>inp.click());
    inp.addEventListener("change",e=>{
      const f=e.target.files[0];e.target.value="";if(!f)return;
      const rd=new FileReader();
      rd.onload=ev=>{
        try{
          const sheets=o.sheetsFromBytes(ev.target.result);
          apply(sheets);
          // any newly-seen student joins the watch list
          const add=(k,nm)=>{if(!D.keys[k])D.keys[k]={roll:null,name:nm,batch:"",parent:"",phone:""};};
          if(D.acad)Object.keys(D.acad.byName).forEach(k=>add(k,D.acad.byName[k].name));
          if(D.fees)Object.keys(D.fees.byName).forEach(k=>add(k,k));
          paint();
        }catch(err){alert("Could not use that file: "+(err.message||err));}
      };
      rd.readAsArrayBuffer(f);
    });
  });
}

/* ---------------- printable call list ---------------- */
function renderCalls(){
  const o=O(),rows=assess().filter(r=>r.level!=="ok");
  MOUNT.innerHTML=`
    <div class="of-view" id="v-calls">
      <div class="of-head no-print">
        <div><div class="of-eyebrow">Work the list</div><h2>Parent Call List</h2></div>
        <div class="of-filters">
          <button class="btn btn-ghost" id="cPrint">Print / Save as PDF</button>
          <button class="btn btn-primary" id="cShare">Share as PDF</button>
        </div>
      </div>
      ${o.printHead("Parent Call List","")}
      <div class="panel" style="padding:8px 6px">
        <table class="call-tbl">
          <thead><tr><th class="c" style="width:52px">Risk</th><th>Student</th><th>Parent &amp; phone</th>
            <th>Why</th><th style="width:190px">What to say</th><th style="width:150px">Outcome</th></tr></thead>
          <tbody>${rows.length?rows.map(r=>`<tr>
            <td class="c"><b style="color:${r.level==="high"?"var(--b1)":"var(--amber)"}">${r.score}</b></td>
            <td><b style="color:var(--navy)">${o.esc(r.name)}</b><div style="font-size:11px;color:var(--mut)">${r.roll!=null?"Roll "+r.roll:""} ${o.esc(r.batch||"")}</div></td>
            <td>${o.esc(r.parent||"—")}<div style="font-size:11.5px;color:var(--navy);font-weight:600">${o.esc(r.phone||"—")}</div></td>
            <td style="font-size:11.5px">${r.flags.map(f=>o.esc(f.label)).join("<br>")||"—"}</td>
            <td style="font-size:11.5px;color:var(--mut)">${o.esc(r.action)}</td>
            <td><div class="call-note"></div></td>
          </tr>`).join(""):`<tr><td colspan="6" class="empty">Nobody needs a call. 🎉</td></tr>`}</tbody>
        </table>
      </div>
      <p style="font-size:11.5px;color:var(--mut2);margin-top:12px">
        Print this, work down it, and write the outcome in the last column. ${rows.length} call${rows.length===1?"":"s"} to make.</p>
    </div>`;
  document.getElementById("cPrint").addEventListener("click",()=>o.printView("v-calls"));
  document.getElementById("cShare").addEventListener("click",e=>{
    const el=document.getElementById("v-calls");
    const hide=[...el.querySelectorAll(".no-print")],prev=hide.map(h=>h.style.display);
    hide.forEach(h=>h.style.display="none");
    const ph=el.querySelector(".of-print-head");if(ph)ph.style.display="flex";
    Promise.resolve(o.sharePDF(el,o.slugify(o.branding.name)+"_call_list.pdf","Parent Call List",e.target))
      .finally(()=>{hide.forEach((h,i)=>h.style.display=prev[i]);if(ph)ph.style.display="";});
  });
}

function paint(){
  OFFICE.tabs([{id:"radar",label:"Radar"},{id:"calls",label:"Call List"}],VIEW,id=>{VIEW=id;paint();});
  if(VIEW==="radar")renderRadar();else renderCalls();
}

OFFICE.boot({
  title:"At-Risk Radar",
  kicker:"Retention",
  headline:"Spot the students about to drift away",
  blurb:"Attendance, falling marks and unpaid fees are the three signs a student is leaving. This crosses all three and tells you who to call today — and how much revenue is walking out with them.",
  noteLeft:"Upload any workbook with Students, Marks, Attendance or Charges sheets. Attach more inside to sharpen the picture.",
  manualHint:"Students, then whatever signals you have. Even a roster plus a fee ledger is enough to start.",
  templateHref:"../../assets/templates/office/Fees_Template.xlsx",
  cacheKey:"tool-atrisk",
  sampleSheets:SAMPLE_SHEETS,
  ledgerSheets:["Charges","Payments"],
  rosterToSheets:students=>({Students:SPDRoster.toAoa(students)}),
  pill:d=>{const n=Object.keys(d.keys).length;return `${n} student${n===1?"":"s"} watched`;},
  parse,
  render:(data,mount)=>{D=data;MOUNT=mount;VIEW="radar";SHOW="risk";paint();}
});
</script>
</body>
</html>

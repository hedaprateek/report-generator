<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student File</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
.sf-layout{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
@media(max-width:980px){.sf-layout{grid-template-columns:1fr}}
.sf-opt{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.sf-opt:last-of-type{border-bottom:none}
.sf-opt input{margin:2px 0 0;width:16px;height:16px;flex-shrink:0;accent-color:var(--teal)}
.sf-opt b{display:block;font-size:13px;color:var(--navy)}
.sf-opt span{font-size:11.5px;color:var(--mut);line-height:1.45}
.sf-opt.disabled{opacity:.5}
.sf-opt.disabled b{color:var(--mut)}
.sf-sub{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.sf-sub label{display:block;font-size:11.5px;font-weight:700;color:var(--navy);
  text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}
.sf-sub select,.sf-sub input[type=text]{width:100%}
.sf-attach{background:#FCFBF7;border:1px dashed var(--line2);border-radius:9px;padding:11px 13px;margin-top:14px}
.sf-attach b{font-size:12.5px;color:var(--navy);display:block;margin-bottom:3px}
.sf-attach p{margin:0 0 8px;font-size:11.5px;color:var(--mut);line-height:1.45}
.sf-attach .ok{color:var(--b5);font-weight:600}

/* Every section is one A4 page so the file collates like a real folder. */
.sf-page{background:#fff;width:210mm;max-width:100%;margin:0 auto 18px;padding:16mm 18mm;
  border:1px solid var(--line);box-shadow:var(--shadow);color:#22262F;min-height:277mm;
  display:flex;flex-direction:column}
.sf-head{display:flex;align-items:center;gap:12px;border-bottom:2.5px solid var(--navy);padding-bottom:10px}
.sf-head img{height:48px;width:auto;border-radius:8px}
.sf-acad{font-family:Georgia,serif;font-size:19px;color:var(--navy);font-weight:600}
.sf-doc{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:2px}
.sf-meta{margin-left:auto;text-align:right;font-size:10.5px;color:var(--mut);line-height:1.5}

.sf-profile{display:flex;gap:18px;margin-top:20px}
.sf-photo,.sf-photo-fb{width:34mm;height:43mm;border-radius:3px;object-fit:cover;border:1px solid var(--line2);flex-shrink:0}
.sf-photo-fb{display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:700;font-size:17mm}
.sf-name{font-family:Georgia,serif;font-size:25px;color:var(--navy);font-weight:700;line-height:1.15}
.sf-class{font-size:13px;color:var(--teal);font-weight:600;margin-top:3px}
.sf-facts{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.sf-fact{padding:7px 0;border-bottom:1px solid var(--line)}
.sf-fact .l{font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:700}
.sf-fact .v{font-size:13px;color:var(--navy);font-weight:600;margin-top:2px}
.sf-sec{margin-top:22px}
.sf-sec h4{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);
  font-weight:700;margin:0 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line2)}
.sf-tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.sf-tbl th{background:#F6F5F0;font-size:9px;padding:6px 8px;border-bottom:1px solid var(--line2);color:var(--navy);text-align:left}
.sf-tbl td{padding:6px 8px;border-bottom:1px solid var(--line)}
.sf-tbl td.r,.sf-tbl th.r{text-align:right}
.sf-sum{margin-top:12px;margin-left:auto;width:min(280px,100%);font-size:12.5px}
.sf-sum div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dotted var(--line)}
.sf-sum .grand{border-bottom:none;border-top:2px solid var(--navy);margin-top:4px;padding-top:7px;
  font-weight:700;font-size:14px;color:var(--navy)}
.sf-body{font-family:Georgia,serif;font-size:13.5px;line-height:2;text-align:justify;margin-top:18px;white-space:pre-wrap;flex:1}
.sf-body b{color:#111}
.sf-title{text-align:center;margin:20px 0 4px;font-size:16px;font-weight:700;color:var(--navy);
  letter-spacing:.08em;text-transform:uppercase;text-decoration:underline;text-underline-offset:5px;font-family:Georgia,serif}
.sf-signrow{display:flex;justify-content:space-between;align-items:flex-end;margin-top:36px}
.sf-sign{text-align:center;font-size:11px;color:var(--mut);border-top:1px solid var(--ink);padding-top:6px;min-width:170px}
.sf-foot{margin-top:14px;border-top:1px solid var(--line);padding-top:7px;font-size:9px;color:var(--mut2);text-align:center}
.sf-cardholder{margin-top:22px;display:flex;justify-content:center}
.sf-card{width:85.6mm;height:54mm;border:1px dashed #C9C4B6;border-radius:3mm;overflow:hidden;
  display:flex;flex-direction:column;background:#fff;position:relative}
.sf-card-strip{background:linear-gradient(90deg,#1B2540,#243257);color:#fff;padding:2mm 3mm;display:flex;align-items:center;gap:2mm}
.sf-card-strip img{height:7mm;border-radius:1mm}
.sf-card-acad{font-family:Georgia,serif;font-size:3.1mm;font-weight:600;line-height:1.15}
.sf-card-sub{font-size:1.9mm;color:#AEB9CC;letter-spacing:.04em;margin-top:.3mm}
.sf-card-body{flex:1;display:flex;gap:3mm;padding:2.5mm 3mm}
.sf-card-photo,.sf-card-fb{width:19mm;height:24mm;border-radius:1.5mm;object-fit:cover;border:.4mm solid var(--line2);flex-shrink:0}
.sf-card-fb{display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:700;font-size:7mm}
.sf-card-name{font-family:Georgia,serif;font-size:3.6mm;font-weight:700;color:var(--navy)}
.sf-card-row{display:flex;gap:1.5mm;font-size:2.3mm;line-height:1.3}
.sf-card-row .l{color:var(--mut);min-width:13mm}
.sf-card-row .v{color:var(--ink);font-weight:600}
.sf-card-foot{border-top:.3mm solid var(--line);padding:1.4mm 3mm;display:flex;justify-content:space-between;font-size:1.9mm;color:var(--mut2)}
.sf-cut{text-align:center;font-size:9px;color:var(--mut2);margin-top:6px}
@media print{.sf-page{width:auto;border:none;box-shadow:none;padding:0;margin:0;min-height:0}}
</style>
<link rel="stylesheet" href="../assets/css/a11y.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
<script src="../assets/js/a11y.js" defer></script>
</head>
<body>
<script>
/* Student File composes what the shared roster already knows, plus anything the user
   chooses to attach. It deliberately does NOT reimplement the five segment report
   engines — an academic summary is derived generically from an attached marks
   workbook instead, so one page here can never drift from the real report card. */
const SAMPLE_SHEETS={
"Students":[
 ["Roll No","Student Name","Class / Batch","Gender","Parent / Guardian Name","Parent Phone","Date of Birth","Admission Date","Blood Group","Address","Conduct","Achievement","Photo URL"],
 [1,"Aarav Shah","11th Science","M","Mr. R. Shah","98765 43210","2008-04-12","2024-06-10","B+","Ichalkaranji, Kolhapur","Excellent","securing first rank in the Term 1 examination",""],
 [2,"Diya Kulkarni","11th Science","F","Mrs. S. Kulkarni","98220 11223","2008-09-02","2024-06-10","O+","Ichalkaranji, Kolhapur","Very Good","outstanding improvement across all subjects",""],
 [3,"Kabir Nair","12th Science","M","Mr. V. Nair","99700 55443","2007-11-25","2023-06-12","A+","Ichalkaranji, Kolhapur","Good","consistent effort and class participation",""]]};

const CERTS={
 bonafide:{label:"Bonafide Certificate",title:"Bonafide Certificate",
  body:`This is to certify that {name}, {relation} {parent}, is a bonafide student of {academy}.

{pronoun_He} {is_are} currently studying in {class} during the academic year {year}. {pronoun_His} date of birth as per our records is {dob}.

This certificate is issued on {his_her} request for the purpose of {purpose}.`},
 character:{label:"Character Certificate",title:"Character Certificate",
  body:`This is to certify that {name}, {relation} {parent}, {has_have} been a student of {academy} in {class} during the academic year {year}.

To the best of our knowledge, {his_her} character and conduct during this period were found to be {conduct}. {pronoun_He} {was_were} regular, well-behaved, and maintained cordial relations with teachers and fellow students.

We wish {him_her} success in all future endeavours.`},
 transfer:{label:"Transfer Certificate",title:"Transfer Certificate",
  body:`This is to certify that {name}, {relation} {parent}, was a student of {academy}.

{pronoun_He} {was_were} admitted on {admission_date} and studied in {class}. {pronoun_His} date of birth as per our records is {dob}.

{pronoun_His} conduct during the period of study was {conduct}. All dues payable to the academy have been cleared.

{pronoun_He} {is_are} hereby relieved from {academy} with effect from {date} at {his_her} own request.`}
};

function parse(sheets){
  const O=OFFICE;
  const aoa=O.findSheet(sheets,"Students")||Object.values(sheets)[0];
  if(!aoa)throw new Error("This workbook has no 'Students' sheet.");
  const rows=O.readTable(aoa,{
    roll:["Roll No","Roll","Sr. No."],name:["Student Name","Name"],
    batch:["Class / Batch","Program / Division","Class","Batch","Division"],
    gender:["Gender","Sex"],parent:["Parent / Guardian Name","Parent Name","Guardian Name"],
    phone:["Parent Phone","Phone","Contact","Mobile"],
    dob:["Date of Birth","DOB"],admission:["Admission Date","Date of Admission"],
    blood:["Blood Group","Blood"],address:["Address","Residence"],
    conduct:["Conduct","Character","Behaviour"],achievement:["Achievement","Award","Award For"],
    photo:["Photo URL","Photo","Picture","Image URL"]
  }).map(r=>({roll:O.toNum(r.roll),name:O.norm(r.name),batch:O.norm(r.batch),gender:O.norm(r.gender),
    parent:O.norm(r.parent),phone:O.norm(r.phone),dob:r.dob,admission:r.admission,
    blood:O.norm(r.blood),address:O.norm(r.address),conduct:O.norm(r.conduct),
    achievement:O.norm(r.achievement),photo:O.norm(r.photo)})).filter(s=>s.name);
  if(!rows.length)throw new Error("No students found — check that a 'Student Name' column exists.");
  return{rows};
}

let D=null,MOUNT=null,CUR=null,FEES=null,ACAD=null;
let SEC={profile:true,idcard:true,fees:false,certificate:false,academic:false};
let CERT="bonafide",YEAR="2025-26",PURPOSE="submission to the concerned authority",VALID="";
const O=()=>OFFICE;

/* ---------------- optional attachments ---------------- */
// Fees: reuse the same charges/payments model the Fees tool uses, so a file printed
// here always agrees with the dues register rather than computing its own answer.
function readFeesWorkbook(sheets){
  const O=OFFICE;
  const chg=O.findSheet(sheets,"Charges"),pay=O.findSheet(sheets,"Payments");
  if(!chg&&!pay)throw new Error("That file has no Charges or Payments sheet.");
  const charges=O.readTable(chg||[],{name:["Student Name","Name"],item:["Item","Particulars","Description","Fee Head"],
    amount:["Amount","Fee","Value"],due:["Due Date","Due","Date"]})
    .map(r=>({name:O.norm(r.name),item:O.norm(r.item)||"Fee",amount:O.toNum(r.amount)||0,due:O.parseDate(r.due)}))
    .filter(c=>c.name&&c.amount>0);
  const payments=O.readTable(pay||[],{receipt:["Receipt No","Receipt"],date:["Date","Payment Date","Paid On"],
    name:["Student Name","Name"],amount:["Amount","Paid","Value"],mode:["Mode","Payment Mode"],note:["Note","Remark","Remarks"]})
    .map(r=>({receipt:O.norm(r.receipt),date:O.parseDate(r.date),name:O.norm(r.name),
      amount:O.toNum(r.amount)||0,mode:O.norm(r.mode)||"Cash",note:O.norm(r.note)}))
    .filter(p=>p.name&&p.amount>0);
  if(!charges.length&&!payments.length)throw new Error("No fee rows found in that file.");
  return{charges,payments};
}
function feesFor(name){
  if(!FEES)return null;
  const k=O().keyName(name);
  const charges=FEES.charges.filter(c=>O().keyName(c.name)===k);
  const payments=FEES.payments.filter(p=>O().keyName(p.name)===k);
  if(!charges.length&&!payments.length)return null;
  const charged=charges.reduce((a,c)=>a+c.amount,0);
  const paid=payments.reduce((a,p)=>a+p.amount,0);
  return{charges,payments,charged,paid,balance:charged-paid};
}
// Academic: a generic block-grid reader that works with any of the five segment
// marks sheets, giving a per-subject average rather than duplicating five engines.
function readMarksWorkbook(sheets){
  const O=OFFICE;
  const aoa=O.findSheet(sheets,"Marks")||O.findSheet(sheets,"Evaluation");
  if(!aoa)throw new Error("That file has no Marks or Evaluation sheet.");
  let hr=-1;
  for(let i=0;i<Math.min(aoa.length,30);i++){
    const row=(aoa[i]||[]).map(O.keyName);
    if(row.some(c=>["student name","name of student","name"].includes(c))){hr=i;break;}
  }
  if(hr<0)throw new Error("Could not find the Student Name header row in that file.");
  const header=aoa[hr]||[];
  let cName=-1;header.forEach((c,i)=>{if(["student name","name of student","name"].includes(O.keyName(c)))cName=i;});
  const skip=new Set(["","total","grand total","overall","remarks","roll no","roll","sr. no.","student name","name"]);
  const cols=[];
  header.forEach((c,i)=>{const k=O.keyName(c);if(i>cName&&!skip.has(k))cols.push({name:O.norm(c),i});});
  const byName={};
  for(let r=hr+1;r<aoa.length;r++){
    const row=aoa[r]||[];const nm=O.norm(row[cName]);if(!nm)continue;
    const subj={};
    cols.forEach(c=>{
      const n=O.toNum(row[c.i]);
      if(n==null)return;
      (subj[c.name]=subj[c.name]||[]).push(n);
    });
    const list=Object.keys(subj).map(s=>({subject:s,
      avg:subj[s].reduce((a,b)=>a+b,0)/subj[s].length,n:subj[s].length}));
    if(list.length)byName[O.keyName(nm)]=list;
  }
  if(!Object.keys(byName).length)throw new Error("No numeric marks found in that file.");
  return byName;
}

/* ---------------- page builders ---------------- */
function initials(n){const p=OFFICE.norm(n).split(/\s+/).filter(Boolean);return((p[0]||"")[0]||"")+((p[1]||"")[0]||"");}
function hueOf(n){let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%360;return h;}
function photoEl(s,cls,fbCls){
  const o=O(),h=hueOf(s.name);
  const fb=`<div class="${fbCls}" style="background:hsl(${h},48%,88%);color:hsl(${h},45%,32%)">${o.esc(initials(s.name).toUpperCase())}</div>`;
  if(!s.photo)return fb;
  return `<img class="${cls}" src="${o.esc(s.photo)}" alt="" onerror="this.outerHTML=${o.esc(JSON.stringify(fb)).replace(/"/g,'&quot;')}">`;
}
function pageHead(docTitle,s){
  const o=O(),b=o.branding;
  return `<div class="sf-head"><img src="${o.esc(b.logoEmblem)}" alt="">
    <div><div class="sf-acad">${o.esc(b.name)}</div><div class="sf-doc">${o.esc(docTitle)}</div></div>
    <div class="sf-meta">${o.esc(s.name)}${s.roll!=null?" · Roll "+s.roll:""}<br>${o.esc(o.fmtDate(o.today()))}</div></div>`;
}
function pageFoot(){return `<div class="sf-foot">Issued by ${O().esc(O().branding.name)} · computer-generated, valid when signed and sealed.</div>`;}

function profilePage(s){
  const o=O();
  const facts=[["Roll No",s.roll!=null?s.roll:"—"],["Class",s.batch||"—"],
    ["Parent / Guardian",s.parent||"—"],["Contact",s.phone||"—"],
    ["Date of Birth",s.dob?o.fmtDate(s.dob):"—"],["Admitted On",s.admission?o.fmtDate(s.admission):"—"],
    ["Blood Group",s.blood||"—"],["Conduct",s.conduct||"—"],["Address",s.address||"—"]];
  return `<div class="sf-page">${pageHead("Student Profile",s)}
    <div class="sf-profile">
      ${photoEl(s,"sf-photo","sf-photo-fb")}
      <div style="flex:1;min-width:0">
        <div class="sf-name">${o.esc(s.name)}</div>
        <div class="sf-class">${o.esc(s.batch||"")}</div>
        <div class="sf-facts">${facts.map(([l,v])=>
          `<div class="sf-fact"><div class="l">${o.esc(l)}</div><div class="v">${o.esc(String(v))}</div></div>`).join("")}</div>
      </div>
    </div>
    ${s.achievement?`<div class="sf-sec"><h4>Recognition</h4>
      <div style="font-size:13px;line-height:1.7">${o.esc(s.achievement)}</div></div>`:""}
    <div style="flex:1"></div>${pageFoot()}</div>`;
}

function idCardPage(s){
  const o=O(),b=o.branding;
  return `<div class="sf-page">${pageHead("Identity Card",s)}
    <div class="sf-cardholder"><div class="sf-card">
      <div class="sf-card-strip"><img src="${o.esc(b.logoEmblem)}" alt="">
        <div><div class="sf-card-acad">${o.esc(b.name)}</div><div class="sf-card-sub">STUDENT IDENTITY CARD</div></div></div>
      <div class="sf-card-body">${photoEl(s,"sf-card-photo","sf-card-fb")}
        <div style="flex:1;min-width:0">
          <div class="sf-card-name">${o.esc(s.name)}</div>
          ${s.batch?`<div class="sf-card-row"><span class="l">Class</span><span class="v">${o.esc(s.batch)}</span></div>`:""}
          ${s.roll!=null?`<div class="sf-card-row"><span class="l">Roll No</span><span class="v">${s.roll}</span></div>`:""}
          ${s.blood?`<div class="sf-card-row"><span class="l">Blood</span><span class="v">${o.esc(s.blood)}</span></div>`:""}
          ${s.phone?`<div class="sf-card-row"><span class="l">Contact</span><span class="v">${o.esc(s.phone)}</span></div>`:""}
        </div></div>
      <div class="sf-card-foot"><span>${VALID?"Valid until "+o.esc(VALID):"If found, please return to the academy"}</span><span>Principal</span></div>
    </div></div>
    <div class="sf-cut">Cut along the dashed edge · standard CR80 size (85.6 × 54 mm)</div>
    <div style="flex:1"></div>${pageFoot()}</div>`;
}

function feesPage(s){
  const o=O(),f=feesFor(s.name);
  if(!f)return "";
  return `<div class="sf-page">${pageHead("Fee Statement",s)}
    <div class="sf-sec"><h4>Charges billed</h4>
      <table class="sf-tbl"><thead><tr><th>Particulars</th><th>Due date</th><th class="r">Amount</th></tr></thead>
      <tbody>${f.charges.length?f.charges.map(c=>`<tr><td>${o.esc(c.item)}</td>
        <td>${c.due?o.esc(o.fmtDate(c.due)):"—"}</td><td class="r">${o.money(c.amount)}</td></tr>`).join(""):
        `<tr><td colspan="3" style="color:var(--mut);font-style:italic">No charges recorded.</td></tr>`}</tbody></table></div>
    <div class="sf-sec"><h4>Payments received</h4>
      <table class="sf-tbl"><thead><tr><th>Date</th><th>Particulars</th><th>Mode</th><th class="r">Amount</th></tr></thead>
      <tbody>${f.payments.length?f.payments.map(p=>`<tr><td>${o.esc(o.fmtDate(p.date))}</td>
        <td>${o.esc(p.note||"Fee payment")}${p.receipt?` <span style="color:var(--mut);font-size:9.5px">(${o.esc(p.receipt)})</span>`:""}</td>
        <td>${o.esc(p.mode)}</td><td class="r">${o.money(p.amount)}</td></tr>`).join(""):
        `<tr><td colspan="4" style="color:var(--mut);font-style:italic">No payments recorded yet.</td></tr>`}</tbody></table></div>
    <div class="sf-sum">
      <div><span>Total billed</span><span>${o.money(f.charged)}</span></div>
      <div><span>Total paid</span><span>${o.money(f.paid)}</span></div>
      <div class="grand"><span>${f.balance>0?"Balance due":"Balance"}</span>
        <span style="color:${f.balance>0?"var(--b1)":"var(--b5)"}">${f.balance>0?o.money(f.balance):(f.balance<0?o.money(-f.balance)+" advance":"Nil")}</span></div>
    </div>
    <div style="margin-top:12px;font-size:11.5px;font-style:italic;color:#444;background:#FCFBF7;
      border-left:3px solid var(--teal);border-radius:6px;padding:9px 12px">${o.esc(o.moneyInWords(f.paid))}</div>
    <div style="flex:1"></div>
    <div class="sf-signrow"><div style="font-size:10.5px;color:var(--mut)">Received with thanks.</div>
      <div class="sf-sign">Authorised Signatory</div></div>${pageFoot()}</div>`;
}

function academicPage(s){
  const o=O();
  const list=ACAD?ACAD[o.keyName(s.name)]:null;
  if(!list||!list.length)return "";
  const overall=list.reduce((a,x)=>a+x.avg,0)/list.length;
  const best=[...list].sort((a,b)=>b.avg-a.avg)[0],weak=[...list].sort((a,b)=>a.avg-b.avg)[0];
  return `<div class="sf-page">${pageHead("Academic Summary",s)}
    <div class="sf-sec"><h4>Subject averages</h4>
      <table class="sf-tbl"><thead><tr><th>Subject</th><th class="r">Entries</th><th class="r">Average</th></tr></thead>
      <tbody>${list.map(x=>`<tr><td>${o.esc(x.subject)}</td><td class="r">${x.n}</td>
        <td class="r"><b>${x.avg.toFixed(1)}</b></td></tr>`).join("")}</tbody></table></div>
    <div class="sf-sec"><h4>At a glance</h4>
      <div class="sf-facts">
        <div class="sf-fact"><div class="l">Overall average</div><div class="v">${overall.toFixed(1)}</div></div>
        <div class="sf-fact"><div class="l">Subjects tracked</div><div class="v">${list.length}</div></div>
        <div class="sf-fact"><div class="l">Strongest</div><div class="v">${o.esc(best.subject)} · ${best.avg.toFixed(1)}</div></div>
        <div class="sf-fact"><div class="l">Needs most support</div><div class="v">${o.esc(weak.subject)} · ${weak.avg.toFixed(1)}</div></div>
      </div></div>
    <p style="margin-top:16px;font-size:11px;color:var(--mut);line-height:1.6">
      This is a summary of the attached marks workbook. For the full report card — rankings, trends,
      topic analysis and teacher remarks — use the program dashboard for this student's segment.</p>
    <div style="flex:1"></div>${pageFoot()}</div>`;
}

function pronouns(g){
  const s=OFFICE.keyName(g);
  const v=sing=>sing?{is_are:"is",was_were:"was",has_have:"has"}:{is_are:"are",was_were:"were",has_have:"have"};
  if(s==="m"||s==="male"||s==="boy")return{He:"He",His:"His",his_her:"his",him_her:"him",relation:"son of",...v(true)};
  if(s==="f"||s==="female"||s==="girl")return{He:"She",His:"Her",his_her:"her",him_her:"her",relation:"daughter of",...v(true)};
  return{He:"They",His:"Their",his_her:"their",him_her:"them",relation:"child of",...v(false)};
}
function certPage(s){
  const o=O(),p=pronouns(s.gender),tpl=CERTS[CERT];
  const f={name:s.name,class:s.batch||"—",parent:s.parent||"—",academy:o.branding.name,
    dob:s.dob?o.fmtDate(s.dob):"—",admission_date:s.admission?o.fmtDate(s.admission):"—",
    conduct:s.conduct||"good",year:YEAR,purpose:PURPOSE,date:o.fmtDate(o.today()),
    pronoun_He:p.He,pronoun_His:p.His,his_her:p.his_her,him_her:p.him_her,relation:p.relation,
    is_are:p.is_are,was_were:p.was_were,has_have:p.has_have};
  const body=o.esc(tpl.body).replace(/\{(\w+)\}/g,(m,k)=>
    f[k]!==undefined?`<b>${o.esc(String(f[k]))}</b>`:`<span style="color:#B4472F">${o.esc(m)}</span>`);
  return `<div class="sf-page">${pageHead(tpl.label,s)}
    <div class="sf-title">${o.esc(tpl.title)}</div>
    <div class="sf-body">${body}</div>
    <div class="sf-signrow"><div style="width:70px;height:70px;border:1.5px dashed var(--line2);border-radius:50%;
      display:flex;align-items:center;justify-content:center;font-size:8.5px;color:var(--mut2);text-align:center">Academy<br>Seal</div>
      <div class="sf-sign">Principal / Authorised Signatory</div></div>${pageFoot()}</div>`;
}

function fileFor(s){
  const parts=[];
  if(SEC.profile)parts.push(profilePage(s));
  if(SEC.idcard)parts.push(idCardPage(s));
  if(SEC.academic)parts.push(academicPage(s));
  if(SEC.fees)parts.push(feesPage(s));
  if(SEC.certificate)parts.push(certPage(s));
  const real=parts.filter(Boolean);
  if(!real.length)return `<div class="empty">Pick at least one section on the left.</div>`;
  return real.map((h,i)=>i?`<div class="page-break">${h}</div>`:h).join("");
}

/* ---------------- view ---------------- */
function render(){
  const o=O();
  if(!CUR&&D.rows[0])CUR=D.rows[0].name;
  const s=D.rows.find(x=>x.name===CUR)||D.rows[0];
  const hasFees=!!feesFor(s.name),hasAcad=!!(ACAD&&ACAD[o.keyName(s.name)]);
  const opt=(k,label,desc,enabled)=>`
    <label class="sf-opt${enabled?"":" disabled"}">
      <input type="checkbox" data-sec="${k}" ${SEC[k]&&enabled?"checked":""} ${enabled?"":"disabled"}>
      <span><b>${o.esc(label)}</b><span>${desc}</span></span>
    </label>`;
  MOUNT.innerHTML=`
    <div class="of-view" id="v-file">
      <div class="of-head no-print">
        <div><div class="of-eyebrow">Everything in one place</div><h2>Student File</h2></div>
        <div class="of-filters">
          <label class="flab">Student</label>
          <select id="sStud">${D.rows.map(x=>`<option value="${o.esc(x.name)}"${x.name===s.name?" selected":""}>${o.esc(x.name)}</option>`).join("")}</select>
          <button class="btn btn-ghost" id="sAll">Print all students</button>
          <button class="btn btn-ghost" id="sPrint">Print / Save as PDF</button>
          <button class="btn btn-primary" id="sShare">Share this file</button>
        </div>
      </div>
      <div class="sf-layout">
        <div class="panel no-print">
          <h3>Include in the file</h3>
          <p class="sub">Tick what this student needs — an admission file, a TC request and a parent meeting all want different pages.</p>
          ${opt("profile","Profile sheet","Photo and every detail on record.",true)}
          ${opt("idcard","ID card","Cut-out identity card at plastic-card size.",true)}
          ${opt("academic","Academic summary",hasAcad?"Subject averages from the attached marks file.":"Attach a marks workbook below to enable.",hasAcad)}
          ${opt("fees","Fee statement",hasFees?"Charges, payments and outstanding balance.":"Attach a fees workbook below to enable.",hasFees)}
          ${opt("certificate","Certificate","Bonafide, character or transfer certificate.",true)}
          <div class="sf-sub"${SEC.certificate?"":' style="display:none"'} id="certOpts">
            <label>Certificate type</label>
            <select id="sCert">${Object.keys(CERTS).map(k=>`<option value="${k}"${k===CERT?" selected":""}>${o.esc(CERTS[k].label)}</option>`).join("")}</select>
            <label style="margin-top:10px">Academic year</label>
            <input type="text" id="sYear" value="${o.esc(YEAR)}">
            <label style="margin-top:10px">Purpose (bonafide)</label>
            <input type="text" id="sPurpose" value="${o.esc(PURPOSE)}">
          </div>
          <div class="sf-sub"${SEC.idcard?"":' style="display:none"'} id="cardOpts">
            <label>ID card valid until</label>
            <input type="text" id="sValid" value="${o.esc(VALID)}" placeholder="e.g. Mar 2026">
          </div>
          <div class="sf-attach">
            <b>Attach a fees workbook</b>
            <p>${FEES?`<span class="ok">✓ Loaded</span> — fee statements available.`:"Optional. Adds the fee statement page."}</p>
            <input type="file" id="feeFile" accept=".xlsx,.xls" style="display:none">
            <button class="btn btn-ghost" id="feePick" style="padding:6px 11px;font-size:12px">${FEES?"Replace file":"Choose file"}</button>
          </div>
          <div class="sf-attach">
            <b>Attach a marks workbook</b>
            <p>${ACAD?`<span class="ok">✓ Loaded</span> — academic summaries available.`:"Optional. Adds a subject-average summary."}</p>
            <input type="file" id="acadFile" accept=".xlsx,.xls" style="display:none">
            <button class="btn btn-ghost" id="acadPick" style="padding:6px 11px;font-size:12px">${ACAD?"Replace file":"Choose file"}</button>
          </div>
          <div id="attachErr" style="display:none;margin-top:10px;font-size:11.5px;color:var(--b1)"></div>
        </div>
        <div id="fileHolder">${fileFor(s)}</div>
      </div>
    </div>`;

  const repaint=()=>{document.getElementById("fileHolder").innerHTML=fileFor(s);};
  document.getElementById("sStud").addEventListener("change",e=>{CUR=e.target.value;render();});
  MOUNT.querySelectorAll("[data-sec]").forEach(cb=>cb.addEventListener("change",e=>{
    SEC[e.target.dataset.sec]=e.target.checked;
    const co=document.getElementById("certOpts");if(co)co.style.display=SEC.certificate?"":"none";
    const ko=document.getElementById("cardOpts");if(ko)ko.style.display=SEC.idcard?"":"none";
    repaint();
  }));
  const bind=(id,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener("input",e=>{fn(e.target.value);repaint();});};
  const bindSel=(id,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener("change",e=>{fn(e.target.value);repaint();});};
  bindSel("sCert",v=>CERT=v);bind("sYear",v=>YEAR=v);bind("sPurpose",v=>PURPOSE=v);bind("sValid",v=>VALID=v);

  const attachErr=m=>{const el=document.getElementById("attachErr");el.textContent=m;el.style.display=m?"block":"none";};
  const attach=(pickId,fileId,reader,assign,enableKey)=>{
    document.getElementById(pickId).addEventListener("click",()=>document.getElementById(fileId).click());
    document.getElementById(fileId).addEventListener("change",e=>{
      const f=e.target.files[0];e.target.value="";if(!f)return;
      const rd=new FileReader();
      rd.onload=ev=>{
        try{
          const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
          const sheets={};wb.SheetNames.forEach(n=>{sheets[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true});});
          assign(reader(sheets));
          SEC[enableKey]=true;
          attachErr("");render();
        }catch(err){attachErr(err.message||"Could not read that file.");}
      };
      rd.readAsArrayBuffer(f);
    });
  };
  attach("feePick","feeFile",readFeesWorkbook,v=>FEES=v,"fees");
  attach("acadPick","acadFile",readMarksWorkbook,v=>ACAD=v,"academic");

  document.getElementById("sPrint").addEventListener("click",()=>o.printView("v-file"));
  document.getElementById("sAll").addEventListener("click",()=>{
    document.getElementById("fileHolder").innerHTML=
      D.rows.map((x,i)=>`<div class="${i?"page-break":""}">${fileFor(x)}</div>`).join("");
    o.printView("v-file");
  });
  document.getElementById("sShare").addEventListener("click",e=>{
    o.sharePDF(document.getElementById("fileHolder"),o.slugify(s.name)+"_student_file.pdf",s.name+" — Student File",e.target);
  });
}

OFFICE.boot({
  title:"Student File",
  kicker:"Front Office",
  headline:"One student, one PDF, everything in it",
  blurb:"Profile, ID card, fee statement and certificate for a student — tick the pages you need and print them as a single file. Ideal for admissions and TC requests.",
  noteLeft:"Uses the shared Student Master, so there's usually nothing to upload. Attach a fees or marks workbook to add those pages.",
  manualHint:"One row per student. Everything else on this page is built from these details.",
  templateHref:"../assets/templates/office/Office_Roster_Template.xlsx",
  cacheKey:"tool-studentfile",
  sampleSheets:SAMPLE_SHEETS,
  rosterToSheets:students=>({Students:SPDRoster.toAoa(students)}),
  pill:d=>`${d.rows.length} students`,
  parse,
  render:(data,mount)=>{D=data;MOUNT=mount;CUR=null;render();}
});
</script>
</body>
</html>
